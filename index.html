<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ClinicalVerifier research prototype</title>
<style>body{font:17px system-ui;max-width:780px;margin:48px auto;padding:20px;color:#18313e}textarea{box-sizing:border-box;width:100%;min-height:180px;font:inherit;padding:12px}button{padding:12px 20px;font:inherit;margin:16px 0}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f0f4f5;padding:16px}</style>
<h1>ClinicalVerifier</h1><p>Research prototype for comparing text with a small reference collection. A supported statement is not a confirmation of clinical safety. Use constructed examples rather than personal information.</p>
<label for="text">Statement to examine</label><textarea id="text"></textarea><button id="submit">Check references</button><p id="status" role="status"></p><pre id="result"></pre>
<script>document.getElementById('submit').onclick=async()=>{const b=document.getElementById('submit'),s=document.getElementById('status'),r=document.getElementById('result');b.disabled=true;r.textContent='';s.textContent='Checking…';try{const response=await fetch('/verify',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:document.getElementById('text').value})});const data=await response.json();s.textContent=response.ok?'Assessment returned':'Assessment unavailable';r.textContent=JSON.stringify(data,null,2)}catch(e){s.textContent='Could not reach the research server.'}finally{b.disabled=false}};</script></html>
